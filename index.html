<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>테스트용 홈페이지</title>
    <style>
        /* 심플한 스타일 설정 */
        body {
            font-family: "Malgun Gothic", sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f9f9f9;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #ddd;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 30px; }
        
        /* 버튼 스타일 */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-second {
            background-color: #28a745;
        }
        .btn-second:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>동영상 재생 테스트 랩</h1>
    <p>반갑습니다! 파이썬과 FFmpeg를 이용한 HLS 조각화 테스트 페이지입니다.<br>
    아래 버튼을 클릭하여 각 동영상의 재생 상태를 확인할 수 있습니다.</p>

    <a href="first.html" class="btn">첫 번째 동영상 테스트</a>
    <a href="second.html" class="btn btn-second">두 번째 동영상 테스트</a>
</div>

</body>
</html>
